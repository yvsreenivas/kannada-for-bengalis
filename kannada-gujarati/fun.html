<body data-page="fun">
<header>
  <h1><span class="h1-icon">🎮</span> મજા</h1>
  <p class="tagline">અક્ષર નીચે ખેંચો — કન્નડ શબ્દ શીખો</p>
  <div class="switcher" style="display:none"></div>
</header>
<main>
  <div id="stage" class="fun-stage">
    <canvas id="bg-canvas"></canvas>

    <div class="fun-bar">
      <span class="fun-stat">⭐ <span id="score">0</span></span>
      <span class="fun-stat">🔤 <span id="left">0</span></span>
      <span class="fun-stat danger" id="eaten-stat" hidden>🐍 <span id="eaten">0</span></span>
    </div>

    <div class="fun-legend" aria-hidden="true">
      <div><span class="fun-dot" style="background:#c9a227"></span> +5</div>
      <div><span class="fun-dot" style="background:#5ec8ff"></span> +10</div>
      <div><span class="fun-dot" style="background:#d97bff"></span> +15</div>
      <div><span class="fun-dot" style="background:#ff6b6b"></span> +25</div>
    </div>

    <div id="float-area" class="fun-field"></div>
    <div id="snake" class="fun-snake">🐍</div>
    <p id="hint" class="fun-hint"></p>
    <div class="fun-tray"><div id="word-container"></div></div>

    <div class="fun-over" id="win">
      <h2 id="win-title"></h2>
      <p id="win-text"></p>
      <button class="fun-again"></button>
    </div>
    <div class="fun-over" id="lose">
      <h2 id="lose-title"></h2>
      <p id="lose-text"></p>
      <button class="fun-again"></button>
    </div>
  </div>

  <div class="fun-controls">
    <button id="level-1" class="fun-btn active"></button>
    <button id="level-2" class="fun-btn"></button>
  </div>
  <div class="fun-controls">
    <button id="reset" class="fun-btn"></button>
    <button id="reset-score" class="fun-btn warn"></button>
  </div>
  <a id="fun-fullscreen" class="fun-fullscreen" href="../kannada-letter-pull.html"></a>
</main>
